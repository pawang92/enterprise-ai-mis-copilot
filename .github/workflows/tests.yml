name: Python tests

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: python -m app.data.generate

      - name: Compile application modules
        run: python -m compileall -q app dashboard.py scripts

      - name: Evaluate local RAG
        run: python scripts/evaluate_rag.py --k 3

      - name: Run test suite
        run: python -m pytest -q
